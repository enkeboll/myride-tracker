# Pre-commit git hook configuration across all language types in MyRide Tracker
# Python: Ruff (Linter & Formatter)
# Web (HTML/CSS/JS) & Config (JSON/YAML/MD): Prettier & Built-in checks

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=100000']
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, css, html, json, yaml, markdown]
        exclude: '(\.har|\.venv|data/)'
